[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitlab-project-visualizer"
version = "0.1.0"
description = "GitLab project visualization tool for supporting student project assessment"
requires-python = ">=3.14"
dependencies = [
    "requests",
    "networkx",
    "matplotlib"
]

[project.optional-dependencies]
dev = [
    "pytest"
]

[project.scripts]
gitlab-visualizer = "gitlab_visualizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]